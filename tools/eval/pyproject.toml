[project]
name = "hoth-eval"
version = "0.1.0"
description = "Offline evaluation harness for HoTH vision prompts (uses ios/HoTH/Resources/prompts.json verbatim)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pillow>=10.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

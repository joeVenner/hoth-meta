name: HoTH
options:
  bundleIdPrefix: io.fomy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  HoTHCore:
    path: Packages/HoTHCore

targets:
  HoTH:
    type: application
    platform: iOS
    sources:
      - path: HoTH
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: HoTHCore
    info:
      path: HoTH/Info.plist
      properties:
        CFBundleDisplayName: HoTH
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: hoth_logo
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: "HoTH uses the live camera so you can photograph a hazard in your neighbourhood right where it is."
        NSMicrophoneUsageDescription: "HoTH uses the microphone so you can describe the problem by voice, in your own language."
        NSLocationWhenInUseUsageDescription: "HoTH uses your location to pin the report on the map and alert neighbours nearby."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fomy.hoth
        INFOPLIST_FILE: HoTH/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES

  HoTHTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HoTHTests]
    dependencies:
      - target: HoTH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fomy.hoth.tests
        GENERATE_INFOPLIST_FILE: YES

  HoTHUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [HoTHUITests]
    dependencies:
      - target: HoTH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.fomy.hoth.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HoTH

schemes:
  HoTH:
    build:
      targets:
        HoTH: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HoTHTests
        - HoTHUITests
    archive:
      config: Release
